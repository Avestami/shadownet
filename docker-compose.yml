version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shadownet
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/shadownet
      - NODE_ENV=production
      - NEXTAUTH_URL=https://blckbrd.ir/cts
      - NEXTAUTH_SECRET=supersecretkey12345
      - PORT=3001
    restart: always

volumes:
  db:
    driver: local 